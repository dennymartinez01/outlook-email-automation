name: Build and deploy Python app to Azure Web App - email-outlook-monitor

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required for actions/checkout

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 🛠️ Create and activate virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 📁 List project files (for debug)
        run: ls -R

      - name: 📦 Zip artifact (excluding venv)
        run: zip -r release.zip . -x "venv/*"

      - name: 🚀 Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: 📥 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: 📂 Unzip for deployment
        run: unzip release.zip

      - name: 🚀 Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'email-outlook-monitor'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_99389199D23D43E780FF90F92427D3F1 }}
