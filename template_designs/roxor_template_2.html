<html>
<head>
  <title>📄 Extracted Invoices</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
  <h2 class="mb-4">📄 Extracted Invoices</h2>

  <!-- 🔍 Filter Form -->
  <form method="get" class="row g-3 mb-4">
    <div class="col-md-6">
      <input type="text" name="vendor" value="" class="form-control"
             placeholder="Search for Vendor, Customer and Invoice Number">
    </div>
    <div class="col-md-3">
      <button class="btn btn-primary">Search</button>
    </div>
  </form>

  <!-- 📊 Invoices Table -->
  <table class="table table-striped table-hover bg-white rounded shadow-sm">
    <thead>
    <tr>
      <th>Invoice #</th>
      <th>Date</th>
      <th>Vendor</th>
      <th>Customer</th>
      <th>Total</th>
      <th>Category</th>
      <th>Status</th>
      <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr>
      <td>113538</td>
      <td>2025-07-18</td>
      <td>AKW GLOBAL LOGISTICS</td>
      <td>Ultra Finishing Limited, Hamnett House</td>
      <td>$88.67</td>
      <td>Non-stock</td>
      <td><span class="badge bg-success">Exported</span></td>
      <td>
        <!-- 🔍 View details -->
        <button type="button"
                class="btn btn-sm btn-primary view-details"
                data-bs-toggle="modal"
                data-bs-target="#invoiceModal"
                data-invoice='{
                  "invoiceNo": "113538",
                  "date": "2025-07-18",
                  "vendor": "AKW GLOBAL LOGISTICS",
                  "customer": "Ultra Finishing Limited, Hamnett House",
                  "total": "$88.67",
                  "category": "Non-stock",
                  "status": "Exported"
                }'>
          View
        </button>

        <a href="#" class="btn btn-sm btn-success">Export</a>

        <!-- Trigger offcanvas -->
        <button type="button"
                class="btn btn-sm btn-secondary view-pdf"
                data-pdf="3008397656_invoice_384145327-25.pdf"
                data-bs-toggle="offcanvas"
                data-bs-target="#pdfOffcanvas">
          View PDF
        </button>
      </td>
    </tr>
    </tbody>
  </table>
</div>

<!-- 📑 Offcanvas PDF Viewer -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="pdfOffcanvas">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">📑 Invoice PDF Preview</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body p-0">
    <iframe id="pdfViewer" src="" style="width:100%;height:100%;border:none;"></iframe>
  </div>
</div>

<!-- 📝 Invoice Details Modal -->
<div class="modal fade" id="invoiceModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Invoice Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <table class="table">
          <tbody>
          <tr><th>Invoice #</th><td id="modalInvoiceNo"></td></tr>
          <tr><th>Date</th><td id="modalDate"></td></tr>
          <tr><th>Vendor</th><td id="modalVendor"></td></tr>
          <tr><th>Customer</th><td id="modalCustomer"></td></tr>
          <tr><th>Total</th><td id="modalTotal"></td></tr>
          <tr><th>Category</th><td id="modalCategory"></td></tr>
          <tr><th>Status</th><td id="modalStatus"></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    // PDF buttons
    const pdfButtons = document.querySelectorAll(".view-pdf");
    const pdfViewer = document.getElementById("pdfViewer");
    pdfButtons.forEach(button => {
      button.addEventListener("click", function () {
        const pdfFile = this.getAttribute("data-pdf");
        pdfViewer.src = pdfFile;
      });
    });

    // Details modal
    const detailButtons = document.querySelectorAll(".view-details");
    detailButtons.forEach(button => {
      button.addEventListener("click", function () {
        const data = JSON.parse(this.getAttribute("data-invoice"));
        document.getElementById("modalInvoiceNo").textContent = data.invoiceNo;
        document.getElementById("modalDate").textContent = data.date;
        document.getElementById("modalVendor").textContent = data.vendor;
        document.getElementById("modalCustomer").textContent = data.customer;
        document.getElementById("modalTotal").textContent = data.total;
        document.getElementById("modalCategory").textContent = data.category;
        document.getElementById("modalStatus").textContent = data.status;
      });
    });
  });
</script>
</body>
</html>
